name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-production-deploy
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: ./Relay
          file: ./Relay/apps/api/Dockerfile
          push: true
          tags: ghcr.io/manishchodhary/relay-api:latest

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./Relay
          file: ./Relay/apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://relaymanish.duckdns.org
          tags: ghcr.io/manishchodhary/relay-web:latest

      - name: Configure SSH
        env:
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy images to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$GHCR_READ_TOKEN"

          printf '%s' "$GHCR_READ_TOKEN" | ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin && bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/Relay/Relay

          docker pull ghcr.io/manishchodhary/relay-api:latest
          docker pull ghcr.io/manishchodhary/relay-web:latest

          docker rm -f relay-api 2>/dev/null || true
          docker run -d \
            --name relay-api \
            --restart unless-stopped \
            --env-file /home/ubuntu/.env.production \
            -p 127.0.0.1:5000:5000 \
            ghcr.io/manishchodhary/relay-api:latest

          docker rm -f relay-web 2>/dev/null || true
          docker run -d \
            --name relay-web \
            --restart unless-stopped \
            -p 127.0.0.1:8080:80 \
            ghcr.io/manishchodhary/relay-web:latest

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:5000/health >/dev/null; then
              break
            fi
            sleep 3
          done

          curl --fail --silent http://127.0.0.1:5000/health >/dev/null
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null
          docker logout ghcr.io
          REMOTE
